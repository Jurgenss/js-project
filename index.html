<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Агро-Калькулятор · Валовой сбор зерна</title>
  <style>
    :root {
      --green-900: #1b4332;
      --green-700: #2d6a4f;
      --green-500: #40916c;
      --green-300: #95d5b2;
      --green-100: #d8f3dc;
      --amber: #f4a261;
      --red: #e76f51;
      --ink: #1b1b1b;
      --muted: #5a6b62;
      --card: #ffffff;
      --radius: 18px;
      --shadow: 0 20px 40px -20px rgba(27, 67, 50, .45);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      font-family: "Segoe UI", "Inter", system-ui, -apple-system, Roboto, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #cfeedd 0%, transparent 55%),
        radial-gradient(900px 500px at 110% 110%, #b7e4c7 0%, transparent 50%),
        linear-gradient(135deg, #eefaf1 0%, #d8f3dc 100%);
    }

    .card {
      width: min(720px, 100%);
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: rise .5s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card__head {
      padding: 32px 36px 26px;
      background:
        linear-gradient(135deg, var(--green-700), var(--green-500));
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .card__head::after {
      content: "";
      position: absolute;
      right: -60px; top: -60px;
      width: 220px; height: 220px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.15);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .card__title {
      margin: 14px 0 6px;
      font-size: clamp(22px, 3.2vw, 30px);
      font-weight: 800;
      letter-spacing: -.01em;
    }

    .card__subtitle {
      margin: 0;
      font-size: 14.5px;
      opacity: .9;
      max-width: 55ch;
    }

    .card__body { padding: 28px 36px 34px; }

    .formula {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--green-100);
      border: 1px dashed var(--green-300);
      color: var(--green-900);
      font-size: 14.5px;
      margin-bottom: 22px;
    }

    .formula code {
      background: #fff;
      padding: 3px 8px;
      border-radius: 8px;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 13.5px;
      color: var(--green-900);
      border: 1px solid var(--green-300);
    }

    .btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--green-700), var(--green-500));
      box-shadow: 0 12px 24px -12px rgba(45,106,79,.7);
      transition: transform .12s ease, box-shadow .2s ease, filter .2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:hover { filter: brightness(1.05); box-shadow: 0 16px 28px -12px rgba(45,106,79,.85); }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible { outline: 3px solid var(--green-300); outline-offset: 3px; }

    /* ===== Блок результата ===== */
    #result {
      margin-top: 22px;
      border-radius: 16px;
      border: 1px solid #e3eee7;
      background: #fafdfb;
      padding: 22px;
      color: var(--muted);
      min-height: 90px;
      transition: background .3s ease, border-color .3s ease, color .3s ease;
    }

    #result.is-ready {
      color: var(--ink);
      background: #fff;
      border-color: var(--green-300);
      animation: pop .35s ease both;
    }

    @keyframes pop {
      0%   { transform: scale(.98); opacity: .6; }
      100% { transform: scale(1);  opacity: 1; }
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    @media (max-width: 560px) {
      .kpis { grid-template-columns: 1fr; }
      .card__head, .card__body { padding-left: 22px; padding-right: 22px; }
    }

    .kpi {
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--green-100);
      border: 1px solid #c7ead3;
    }

    .kpi__label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--green-700);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .kpi__value {
      font-size: 20px;
      font-weight: 800;
      color: var(--green-900);
      font-variant-numeric: tabular-nums;
    }

    .verdict {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
    }

    .verdict--high {
      background: linear-gradient(135deg, #d8f3dc, #b7e4c7);
      color: var(--green-900);
      border: 1px solid var(--green-300);
    }

    .verdict--low {
      background: linear-gradient(135deg, #fff4e6, #ffe0b2);
      color: #8a4b00;
      border: 1px solid #ffcc80;
    }

    .verdict__icon {
      font-size: 22px;
      line-height: 1;
    }

    .error {
      color: var(--red);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="card__head">
      <span class="badge">🌾 Вариант 1 · Агро-калькулятор</span>
      <h1 class="card__title">Расчёт валового сбора зерна</h1>
      <p class="card__subtitle">
        Введите площадь поля и урожайность — калькулятор переведёт центнеры в тонны
        и оценит урожай.
      </p>
    </header>

    <section class="card__body">
      <div class="formula">
        <span>Формула:</span>
        <code>сбор (т) = площадь (га) × урожайность (ц/га) / 10</code>
        <span style="opacity:.7">· порог «высокого» урожая — 100 т</span>
      </div>

      <button class="btn" id="calcBtn" type="button">
        <span aria-hidden="true">▶</span> Ввести данные и рассчитать
      </button>

      <!-- Блок вывода результата -->
      <div id="result">Нажмите кнопку, чтобы ввести данные о поле…</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
